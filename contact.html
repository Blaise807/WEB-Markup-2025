</head>
<body>
  <header>
    <nav aria-label="Primary">
      <a href="index.html" title="Go to Home">
        <img src="img/ASIAN-FOOD-edited-logo.png" alt="logo">
      </a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="restaurants.html">Restaurants</a></li>

        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="content">
    <section class="form-container" aria-labelledby="contact-title">
      <h1 id="contact-title">Contact Us</h1>
      <p>Please use the form to send feedback, corrections, or suggestions. Fields marked * are required.</p>

      <form action="#" method="post">
        <fieldset>
          <legend>Message</legend>

          <label for="salutation">Salutation</label>
          <select id="salutation" name="salutation" required>
            <option value="">Select…</option>
            <option>Mr.</option>
            <option>Mrs.</option>
            <option>Ms.</option>
            <option>Mx.</option>
          </select>

          <label for="name">Name *</label>
          <input id="name" name="name" type="text" required>

          <label for="email">Email *</label>
          <input id="email" name="email" type="email" required>

          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" placeholder="+31…">

          <label for="topic">Topic</label>
          <select id="topic" name="topic">
            <option value="">General</option>
            <option value="error">Report outdated info</option>
            <option value="suggestion">Suggest a restaurant</option>
            <option value="favorite">Help with favorites</option>
          </select>

          <label for="message">Your message *</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button type="submit">Submit</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <a href="index.html" class="logo">
      <img src="img/footer logo.png" alt="Footer logo">
    </a>

  </footer>
</body>
